default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: myapp_development
  username: postgres
  password: password
  host: localhost

test:
  <<: *default
  database: myapp_test
  username: postgres
  password: password
  host: localhost

production:
  url: <%= ENV["DATABASE_URL"] %>
  pool: 5